[project]
name = "agent-knowledge-base"
version = "0.1.0"
description = "POC of a knowledge base that gives AI agents accurate, current and authorized company knowledge."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "fastmcp>=2.3",
    "cedarpy>=4.1",
    "pyjwt>=2.9",
    "typer>=0.12",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]

[project.scripts]
kb = "kb.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "commitizen>=3.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Conventional Commits are checked on every commit message (see .pre-commit-config.yaml).
# Version bumping and changelog generation are intentionally not used.
[tool.commitizen]
name = "cz_conventional_commits"
