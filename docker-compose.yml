services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Optional local LLM for the observer's diagnosis and the LLM judge.
  # Start with: docker compose --profile llm up -d
  # On macOS a native Ollama install is much faster (uses the GPU).
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
