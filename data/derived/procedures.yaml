- id: procedure:request-vacation-ca
  title: How to request vacation (Canada)
  language: en
  steps: '1. Check your balance: full-time employees receive 15 days of paid vacation
    per year; up to 5 unused days carry over and must be used by March 31.

    2. Submit the request in Workday at least 2 weeks before the first day off.

    3. Your manager approves or declines within 3 business days.'
